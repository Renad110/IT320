
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .app {
    height: 100vh;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    font-family: 'Tajawal', sans-serif;
    border-radius: 16px;
    overflow: hidden;
  }

  .top {
    flex: 1.4;
    background: #0F6E56;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .top::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .circle-bg {
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(29,158,117,0.25);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .logo-circle {
    position: relative;
    z-index: 2;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: #F5F2EA;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-img {
    width: 110px; height: 110px;
    object-fit: contain;
  }

  .bottom {
    flex: 1.6;
    background: #F5F2EA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .welcome-title {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    margin-bottom: 10px;
    direction: rtl;
    text-align: center;
  }

  .welcome-sub {
    font-size: 14px;
    font-weight: 300;
    color: rgba(0,0,0,0.4);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 40px;
    direction: rtl;
    max-width: 280px;
  }

  .btn {
    width: 100%;
    max-width: 320px;
    padding: 16px 0;
    border-radius: 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    direction: rtl;
    transition: filter 0.15s, transform 0.12s;
  }
  .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }

  .btn-login {
    background: #0F6E56;
    color: #fff;
    margin-bottom: 14px;
  }

  .btn-signup {
    background: #1D9E75;
    color: #fff;
  }
</style>

<div class="app">
  <div class="top">
    <div class="circle-bg"></div>
    <div class="logo-circle">
      <img class="logo-img" src="logo.jpg" alt="نفل" />
    </div>
  </div>
  <div class="bottom">
    <div class="welcome-title">أهلاً بك!</div>
    <div class="welcome-sub">انضم إلى مجتمع نفل وابدأ تجربتك معنا الآن</div>
    <button class="btn btn-login"onclick="window.location.href='login.html'">تسجيل الدخول كمستخدم </button>
        <button class="btn btn-login"onclick="window.location.href='preview.html'">تسجيل الدخول كمسؤول</button>
    <button class="btn btn-signup" onclick="window.location.href='signup.html'">إنشاء حساب</button>
  </div>
</div>

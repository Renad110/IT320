<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الفعالية - المشرف</title>

<style>
body {
  font-family:'IBM Plex Sans Arabic', sans-serif;
  background:#f5f7f0;
}

.container {
  max-width:900px;
  margin:40px auto;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.hero {
  width:100%;
  height:300px;
  object-fit:cover;
}

.content {
  padding:24px;
}

.title {
  font-size:1.6rem;
  font-weight:700;
  margin-bottom:10px;
}

.status {
  display:inline-block;
  padding:.3rem .9rem;
  border-radius:999px;
  font-size:.8rem;
  margin-bottom:15px;
}

.pending { background:#fef9c3; color:#92400e; }
.approved { background:#dcfce7; color:#166534; }
.rejected { background:#fee2e2; color:#991b1b; }

.info p {
  margin:6px 0;
  color:#444;
}

.actions {
  display:flex;
  gap:10px;
  margin-top:20px;
}

button {
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.approve { background:#2d6a35; color:#fff; }
.reject { background:#dc2626; color:#fff; }

.back {
  display:block;
  margin:20px;
  color:#2d6a35;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<a href="admin-review.html" class="back">← رجوع للوحة المشرف</a>

<div class="container" id="box"></div>

<script>

// ✅ نجيب البيانات من admin-review
const events = JSON.parse(localStorage.getItem("events")) || [];

const id = parseInt(new URLSearchParams(location.search).get("id"));
const ev = events.find(e => e.id === id);

if(!ev){
  document.getElementById("box").innerHTML = "<p style='padding:20px'>❌ الفعالية غير موجودة</p>";
} else {

render();

function render(){
  document.getElementById("box").innerHTML = `
    <img class="hero" src="${ev.image}" 
    onerror="this.src='https://via.placeholder.com/900x300'">

    <div class="content">

      <div class="title">${ev.title}</div>

      <div class="status ${ev.status}">
        ${getStatus(ev.status)}
      </div>

      <div class="info">
        <p><b>المنظم:</b> ${ev.organizer}</p>
        <p><b>التصنيف:</b> ${ev.category}</p>
        <p><b>التاريخ:</b> ${ev.date}</p>
        <p><b>الموقع:</b> ${ev.location}</p>
        <p><b>النقاط:</b> ${ev.points}</p>
        <p>${ev.desc}</p>
      </div>

      ${ev.status === 'pending' ? `
      <div class="actions">
        <button class="approve" onclick="approve()">اعتماد</button>
        <button class="reject" onclick="reject()">رفض</button>
      </div>
      ` : ''}

    </div>
  `;
}

function getStatus(s){
  if(s==='pending') return 'قيد المراجعة';
  if(s==='approved') return 'معتمدة';
  if(s==='rejected') return 'مرفوضة';
}

function approve(){
  ev.status = 'approved';
  save();
}

function reject(){
  ev.status = 'rejected';
  save();
}

function save(){
  localStorage.setItem("events", JSON.stringify(events));
  render();
}

}
</script>

</body>
</html>

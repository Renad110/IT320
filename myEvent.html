<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نفل - فعالياتي</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="home.html" class="brand">
      <img src="logo.jpg" alt="نفل" />
    </a>
    <div class="header-right">
      <div class="user-chip">
        <div class="user-avatar">س</div>
        <span class="user-name">سارة الغامدي</span>
      </div>
 
      <div class="badge-widget">
        <div class="badge-info">
          <div class="badge-name" style="color:#ca8a04">🥇 ذهبي</div>
          <div class="badge-pts">72 / 100 نقطة</div>
          <div class="progress-wrap">
            <div class="progress-bar" style="width:72%;background:#ca8a04"></div>
          </div>
        </div>
      </div>
 
      <div class="nav-links">
        <a href="myEvent.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
          <span>فعالياتي</span>
        </a>
        <a href="organized-events.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/></svg>
          <span>فعالياتي المنظمة</span>
        </a>
      </div>
</header>
<section class="hero">
  <div class="hero-inner">
    <div class="hero-greeting">مرحباً بك 👋</div>
    <h2>فعالياتي</h2>
    <p>تابع الفعاليات المسجل فيها وأكد حضورك واستعرض شهادتك</p>
  </div>
</section>
<main class="main">
  <div class="tabs">
    <button class="tab-btn active" data-tab="upcoming">القادمة</button>
    <button class="tab-btn" data-tab="past">السابقة</button>
    <button class="tab-btn" data-tab="completed">المكتملة</button>
  </div>
  <div class="events-grid" id="eventsGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h3>ما عندك فعاليات</h3>
    <p>سجّل من صفحة الفعاليات وبتظهر لك هنا مباشرة</p>
  </div>
</main>
<script src="myEvent.js"></script>
  <div id="toast" class="toast"></div>
</body>
</html>
